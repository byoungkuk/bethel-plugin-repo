<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--primary:#2563EB;--accent:#F59E0B;--text:#333;--line:#E5E5E5;--bg:#FFFFFF}
body{margin:0;background:var(--bg);font-family:'Noto Sans KR',sans-serif;color:var(--text)}
.container{width:1200px;margin:0 auto;padding:64px 48px}
h1{font-size:48px;font-weight:900;margin:0 0 16px;color:var(--primary)}
h2{font-size:24px;font-weight:700;margin:0 0 48px;color:var(--text)}
.grid{display:grid;grid-template-columns:PLACEHOLDER_compare-2col;gap:24px}
.card{position:relative;padding:32px;border-radius:16px;background:color-mix(in srgb,var(--primary) 10%,transparent);overflow:hidden}
.card .bg-circle{position:absolute;top:-40px;right:-40px;width:160px;height:160px;border-radius:50%;background:var(--primary);opacity:.15}
.card h3{font-size:20px;font-weight:700;margin:0 0 12px;color:var(--primary);position:relative}
.card p{font-size:16px;line-height:1.6;margin:0;position:relative}
</style></head><body><div class="container">
<h1>메인 타이틀</h1><h2>서브 타이틀</h2>

<div class="card"><div class="bg-circle"></div><h3>제목 2</h3><p>본문 내용 60자 이내로 작성합니다.</p></div>

<div class="card"><div class="bg-circle"></div><h3>제목 5</h3><p>본문 내용 60자 이내로 작성합니다.</p></div>
<div class="card"><div class="bg-circle"></div><h3>제목 6</h3><p>본문 내용 60자 이내로 작성합니다.</p></div>
</div></div></body></html>
